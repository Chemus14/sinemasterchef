  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #fdf6f0; --cream-mid: #f5ebe0; --brown: #2d1a0e;
      --brown-mid: #5c3d25; --orange: #e86d3a; --orange-lt: #fce8dc;
      --orange-dk: #c4511f; --muted: #7a6258; --muted-lt: #a08070;
      --white: #ffffff; --border: #e8ddd4;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--brown); font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.6; overflow-x: hidden; cursor: none; }
    h1,h2,h3,h4 { font-family: 'Fraunces', serif; font-weight: 700; line-height: 1.15; }
    a { color: inherit; text-decoration: none; cursor: none; }
    button { cursor: none; }

    /* CURSOR */
    #cur-dot { position:fixed;width:10px;height:10px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s; }
    #cur-ring { position:fixed;width:36px;height:36px;border:2px solid rgba(232,109,58,.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,opacity .2s; }

    /* CANVAS */
    #pcvs { position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5; }

    /* NAV */
    nav { position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(253,246,240,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 5vw;display:flex;justify-content:space-between;align-items:center;height:68px;transition:box-shadow .3s; }
    nav.scrolled { box-shadow:0 2px 24px rgba(45,26,14,.1); }
    .nav-logo { font-family:'Fraunces',serif;font-size:22px;font-weight:700;z-index:1;position:relative; }
    .nav-logo span { color:var(--orange); }
    .nav-links { display:flex;gap:32px;list-style:none;font-size:14px;color:var(--muted); }
    .nav-links a { position:relative;padding-bottom:2px;transition:color .2s; }
    .nav-links a::after { content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:var(--orange);border-radius:2px;transition:width .3s; }
    .nav-links a:hover { color:var(--orange); }
    .nav-links a:hover::after { width:100%; }
    .nav-cta { background:var(--orange);color:#fff;padding:10px 22px;border-radius:100px;font-size:14px;font-weight:500;transition:background .2s,transform .15s,box-shadow .2s;position:relative;z-index:1; }
    .nav-cta:hover { background:var(--orange-dk);transform:scale(1.04);box-shadow:0 6px 20px rgba(232,109,58,.35); }

    /* HAMBURGER */
    .ham { display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:none;width:36px;height:36px;padding:4px;z-index:601;position:relative; }
    .ham span { display:block;width:100%;height:2px;background:var(--brown);border-radius:2px;transition:transform .35s cubic-bezier(.23,1,.32,1),opacity .25s,background .2s;transform-origin:center; }
    .ham.open span:nth-child(1) { transform:translateY(7px) rotate(45deg);background:var(--orange); }
    .ham.open span:nth-child(2) { opacity:0;transform:scaleX(0); }
    .ham.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg);background:var(--orange); }

    /* MOBILE MENU */
    .mob-menu { position:fixed;inset:0;background:var(--cream);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateX(100%);transition:transform .45s cubic-bezier(.23,1,.32,1); }
    .mob-menu.open { transform:translateX(0); }
    .mob-menu a { font-family:'Fraunces',serif;font-size:clamp(36px,9vw,56px);font-weight:700;color:var(--brown);padding:10px 0;position:relative;display:block;transition:color .25s; }
    .mob-menu a::before { content:'';position:absolute;left:0;bottom:8px;width:0;height:4px;background:var(--orange);border-radius:2px;transition:width .35s; }
    .mob-menu a:hover { color:var(--orange); }
    .mob-menu a:hover::before { width:100%; }
    .mob-cta { margin-top:28px;background:var(--orange)!important;color:#fff!important;padding:16px 44px;border-radius:100px;font-size:20px!important;transition:background .2s!important; }
    .mob-cta:hover { background:var(--orange-dk)!important; }
    .mob-cta::before { display:none!important; }
    .mob-deco { position:absolute;font-size:110px;opacity:.05;user-select:none;pointer-events:none; }
    .mob-deco.tl { top:16px;left:16px; }
    .mob-deco.br { bottom:16px;right:16px;transform:scaleX(-1); }

    /* HERO */
    #home { min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:100px 5vw 60px;gap:48px;position:relative;overflow:hidden;z-index:1; }
    .hero-blob { position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#fce8dc 0%,#f9c5a0 40%,transparent 70%);right:-80px;top:50%;transform:translateY(-50%);animation:blob 7s ease-in-out infinite;filter:blur(40px);opacity:.7;pointer-events:none; }
    @keyframes blob { 0%,100%{transform:translateY(-50%) scale(1)} 50%{transform:translateY(-55%) scale(1.1)} }

    .hero-tag { display:inline-flex;align-items:center;gap:6px;background:var(--orange-lt);color:var(--orange-dk);font-size:12px;font-weight:500;padding:6px 14px;border-radius:100px;margin-bottom:20px;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .3s both; }
    @keyframes pop { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
    .hero-tag::before { content:'✦';font-size:10px; }

    h1.hero-title { font-size:clamp(36px,5vw,58px);margin-bottom:20px;animation:sup .7s cubic-bezier(.23,1,.32,1) .4s both; }
    h1.hero-title em { font-style:italic;color:var(--orange); }
    @keyframes sup { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }

    .hero-sub { font-size:17px;color:var(--muted);font-weight:300;line-height:1.75;max-width:440px;margin-bottom:36px;animation:sup .7s cubic-bezier(.23,1,.32,1) .5s both; }
    .hero-actions { display:flex;gap:16px;align-items:center;flex-wrap:wrap;animation:sup .7s cubic-bezier(.23,1,.32,1) .6s both; }

    .btn-primary { background:var(--orange);color:#fff;padding:14px 28px;border-radius:100px;font-size:15px;font-weight:500;border:none;transition:background .2s,transform .15s,box-shadow .2s;display:inline-block; }
    .btn-primary:hover { background:var(--orange-dk);transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,109,58,.35); }
    .btn-ghost { color:var(--brown);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;transition:gap .25s; }
    .btn-ghost:hover { gap:12px; }

    .hero-visual { display:flex;justify-content:center;align-items:center;position:relative;animation:float 5s ease-in-out infinite, sup .8s cubic-bezier(.23,1,.32,1) .5s both; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }

    .hero-badges { position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);display:flex;gap:8px; }
    .badge-pill { background:var(--white);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--brown-mid);white-space:nowrap;box-shadow:0 4px 14px rgba(45,26,14,.08);opacity:0;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both; }
    .badge-pill:nth-child(1){animation-delay:.8s} .badge-pill:nth-child(2){animation-delay:.95s} .badge-pill:nth-child(3){animation-delay:1.1s}

    .hero-stats { display:flex;gap:32px;margin-top:48px;padding-top:32px;border-top:1px solid var(--border);animation:sup .7s cubic-bezier(.23,1,.32,1) .7s both; }
    .stat-num { font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--orange); }
    .stat-label { font-size:12px;color:var(--muted);letter-spacing:.5px; }

    /* MARQUEE */
    .marquee-strip { background:var(--orange);color:#fff;padding:14px 0;overflow:hidden;white-space:nowrap;position:relative;z-index:1; }
    .marquee-track { display:inline-flex;animation:mq 22s linear infinite; }
    .marquee-track span { font-family:'Fraunces',serif;font-size:16px;font-style:italic;padding:0 28px; }
    .marquee-track span::before { content:'✦';margin-right:28px;font-style:normal;font-size:11px;opacity:.7; }
    @keyframes mq { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    /* SECTIONS */
    section { padding:96px 5vw;position:relative;z-index:1; }
    .sec-tag { display:inline-block;background:var(--orange-lt);color:var(--orange-dk);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:14px; }
    .sec-title { font-size:clamp(28px,3.5vw,42px);color:var(--brown);margin-bottom:16px; }
    .sec-sub { font-size:16px;color:var(--muted);font-weight:300;max-width:520px;line-height:1.8; }

    /* MENU */
    #menu { background:var(--white); }
    .menu-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:48px; }
    .menu-card { background:var(--cream);border-radius:22px;overflow:hidden;border:1px solid var(--border);transition:transform .35s cubic-bezier(.23,1,.32,1),box-shadow .35s;position:relative; }
    .menu-card::after { content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s;border-radius:22px;pointer-events:none; }
    .menu-card:hover::after { transform:translateX(100%); }
    .menu-card:hover { transform:translateY(-8px) rotate(-.5deg);box-shadow:0 20px 48px rgba(232,109,58,.15); }
    .mc-img { height:160px;display:flex;align-items:center;justify-content:center;font-size:66px;background:var(--cream-mid);transition:transform .4s cubic-bezier(.23,1,.32,1); }
    .menu-card:hover .mc-img { transform:scale(1.09); }
    .mc-body { padding:20px; }
    .mc-name { font-family:'Fraunces',serif;font-size:18px;font-weight:700;margin-bottom:6px; }
    .mc-desc { font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px; }
    .mc-foot { display:flex;justify-content:space-between;align-items:center; }
    .mc-price { font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--orange); }
    .mc-badge { font-size:11px;background:var(--orange-lt);color:var(--orange-dk);padding:3px 10px;border-radius:100px;font-weight:500; }

    /* PROCESS */
    #process { background:var(--brown);color:var(--cream);overflow:hidden; }
    #process .sec-title { color:var(--cream); }
    #process .sec-sub { color:rgba(253,246,240,.6); }
    #process::before { content:'';position:absolute;width:500px;height:500px;border-radius:50%;border:80px solid rgba(232,109,58,.07);top:-150px;right:-150px;animation:spin 30s linear infinite; }
    #process::after { content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:50px solid rgba(232,109,58,.05);bottom:-80px;left:-80px;animation:spin 20s linear infinite reverse; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .steps { display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;margin-top:56px;position:relative; }
    .step-num { font-family:'Fraunces',serif;font-size:72px;font-weight:700;color:rgba(232,109,58,.18);line-height:1;margin-bottom:-8px;transition:color .3s; }
    .step:hover .step-num { color:rgba(232,109,58,.45); }
    .step-title { font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--cream);margin-bottom:10px; }
    .step-desc { font-size:14px;color:rgba(253,246,240,.6);line-height:1.75; }

    /* REVIEWS */
    #reviews { background:var(--cream-mid); }
    .rev-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:48px; }
    .rev-card { background:var(--white);border-radius:20px;padding:28px;border:1px solid var(--border);transition:transform .35s cubic-bezier(.23,1,.32,1),box-shadow .35s; }
    .rev-card:hover { transform:translateY(-6px);box-shadow:0 16px 40px rgba(45,26,14,.08); }
    .rev-stars { color:var(--orange);font-size:16px;margin-bottom:14px;letter-spacing:3px; }
    .rev-text { font-size:15px;color:var(--brown-mid);line-height:1.75;font-style:italic;margin-bottom:18px; }
    .rev-author { font-size:13px;font-weight:500;color:var(--brown); }
    .rev-role { font-size:12px;color:var(--muted-lt); }

    /* CONTACT */
    #contact { background:var(--white); }
    .contact-grid { display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:56px;align-items:start; }
    .ci-item { display:flex;gap:16px;align-items:flex-start;margin-bottom:28px; }
    .ci-icon { width:44px;height:44px;border-radius:12px;background:var(--orange-lt);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:transform .2s,background .2s; }
    .ci-item:hover .ci-icon { transform:scale(1.1) rotate(-6deg);background:var(--orange); }
    .ci-label { font-size:12px;color:var(--muted-lt);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px; }
    .ci-val { font-size:15px;font-weight:500;color:var(--brown); }

    .wa-btn { display:flex;align-items:center;gap:12px;background:#25d366;color:#fff;padding:16px 24px;border-radius:14px;font-size:15px;font-weight:500;margin-top:32px;transition:background .2s,transform .2s,box-shadow .2s;width:fit-content;position:relative;overflow:hidden; }
    .wa-btn::before { content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-100%);transition:transform .5s; }
    .wa-btn:hover { background:#1fba58;transform:translateY(-3px);box-shadow:0 10px 30px rgba(37,211,102,.35); }
    .wa-btn:hover::before { transform:translateX(100%); }
    .wa-btn svg { width:24px;height:24px;fill:#fff;flex-shrink:0; }

    .cform { display:flex;flex-direction:column;gap:18px; }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
    .fg { display:flex;flex-direction:column;gap:7px; }
    label { font-size:13px;font-weight:500;color:var(--brown-mid); }
    input,select,textarea { padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--brown);background:var(--cream);transition:border-color .25s,box-shadow .25s,transform .2s;outline:none; }
    input::placeholder,textarea::placeholder { color:var(--muted-lt); }
    input:focus,select:focus,textarea:focus { border-color:var(--orange);box-shadow:0 0 0 4px rgba(232,109,58,.1);transform:translateY(-1px); }
    textarea { resize:vertical;min-height:120px; }
    .f-submit { background:var(--orange);color:#fff;padding:14px 32px;border-radius:100px;font-size:15px;font-weight:500;border:none;transition:background .2s,transform .15s,box-shadow .2s;align-self:flex-start; }
    .f-submit:hover { background:var(--orange-dk);transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,109,58,.35); }
    .f-ok { display:none;background:#edf7f1;border:1px solid #b8e0c7;color:#1d6336;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:500; }

    /* FOOTER */
    footer { background:var(--brown);color:rgba(253,246,240,.7);padding:56px 5vw 32px;position:relative;z-index:1; }
    .foot-grid { display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px;margin-bottom:48px; }
    .foot-logo { font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--cream);margin-bottom:14px; }
    .foot-logo span { color:var(--orange); }
    .foot-desc { font-size:14px;line-height:1.8;max-width:280px; }
    .foot-col-title { font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--cream);margin-bottom:18px;font-weight:500; }
    .foot-links { list-style:none;display:flex;flex-direction:column;gap:10px; }
    .foot-links a { font-size:14px;color:rgba(253,246,240,.6);transition:color .2s,padding-left .2s; }
    .foot-links a:hover { color:var(--orange);padding-left:4px; }
    .foot-bottom { border-top:1px solid rgba(253,246,240,.12);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:13px; }
    .foot-social { display:flex;gap:14px; }
    .soc { width:36px;height:36px;border-radius:50%;border:1px solid rgba(253,246,240,.2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .2s,border-color .2s,transform .2s; }
    .soc:hover { background:var(--orange);border-color:var(--orange);transform:translateY(-3px); }

    /* FLOAT WA */
    .fwa { position:fixed;bottom:28px;right:28px;width:58px;height:58px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(37,211,102,.45);z-index:999;transition:transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s;animation:wabounce 2s ease-in-out 2s 3; }
    .fwa:hover { transform:scale(1.15);box-shadow:0 8px 32px rgba(37,211,102,.55); }
    @keyframes wabounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .fwa svg { width:30px;height:30px;fill:#fff; }
    .fwa-tip { position:absolute;right:70px;background:var(--brown);color:var(--cream);font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateX(8px); }
    .fwa-tip::after { content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left-color:var(--brown);border-right:none; }
    .fwa:hover .fwa-tip { opacity:1;transform:translateX(0); }

    /* REVEAL ANIMATIONS */
    .reveal,.reveal-l,.reveal-r { opacity:0;transition:opacity .7s cubic-bezier(.23,1,.32,1),transform .7s cubic-bezier(.23,1,.32,1); }
    .reveal { transform:translateY(38px); }
    .reveal-l { transform:translateX(-38px); }
    .reveal-r { transform:translateX(38px); }
    .reveal.v,.reveal-l.v,.reveal-r.v { opacity:1;transform:translate(0); }

    /* RESPONSIVE */
    @media(max-width:860px) {
      body{cursor:auto} #cur-dot,#cur-ring{display:none} a,button{cursor:pointer}
      #home{grid-template-columns:1fr;text-align:center;padding-top:96px;padding-bottom:80px}
      .hero-sub{
